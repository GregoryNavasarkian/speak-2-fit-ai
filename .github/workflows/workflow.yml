name: Speak2Fit CI/CD Pipeline

on:
  push:
    branches:
      - main # Runs on commits pushed to main
  pull_request:
    branches:
      - main # Runs on PRs targeting main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Use Node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Lint Server
        run: |
          cd server
          npm run lint

      - name: Lint Client
        run: |
          cd client
          npm run lint

      - name: Format Server
        run: |
          cd server
          npm run format

      - name: Format Client
        run: |
          cd client
          npm run format

      - name: Test Server
        run: |
          cd server
          npm run test

      - name: Build Docker Image
        run: |
          docker build -t us-central1-docker.pkg.dev/speak2fit-ai/speak2fit/speak2fit:latest .

      - name: Log in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Configure docker for gcloud
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Push Docker Image
        run: |
          docker push us-central1-docker.pkg.dev/speak2fit-ai/speak2fit/speak2fit:latest

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: "latest"
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy App
        run: |
          gcloud app deploy --image-url us-central1-docker.pkg.dev/speak2fit-ai/speak2fit/speak2fit
